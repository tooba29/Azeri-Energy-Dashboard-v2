# YOLO Classification Training Configuration
# Path to classification dataset (folder-per-class structure)
data: data/processed/cls_defects

# Model settings
model: yolov8s-cls.pt  # yolov8n-cls.pt, yolov8s-cls.pt, yolov8m-cls.pt, yolov8l-cls.pt, yolov8x-cls.pt
epochs: 80
imgsz: 224
batch: 64  # Increase if GPU memory allows, reduce if OOM
workers: 8
device: 0  # GPU device, or 'cpu' or 'auto'

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5

# Optimization
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Validation
val: true
save_period: 10

# Output
project: ./outputs/runs
name: cls_train
exist_ok: true
