# Dataset Sources Configuration
# Define paths to your downloaded datasets and their annotation formats
# 
# Supported formats: yolo, coco, voc, custom
# 
# For YOLO format:
#   - images_dir: directory containing images
#   - labels_dir: directory containing .txt label files
#
# For COCO format:
#   - images_dir: directory containing images
#   - ann_path: path to instances.json or annotations.json
#
# For VOC format:
#   - images_dir: directory containing images (e.g., JPEGImages)
#   - ann_dir: directory containing XML annotation files (e.g., Annotations)
#
# For custom format:
#   - Add your own converter in src/converters/custom_to_yolo.py
#   - See README for instructions

datasets:
  # Example: InsPLAD (COCO format)
  - name: insplad_det
    path: data/raw/insplad_det
    format: coco
    images_dir: images
    ann_path: annotations/instances.json
    enabled: true
    max_images: null  # null = use all, or set limit for quick testing
  
  # Example: PLAD (YOLO format)
  - name: plad
    path: data/raw/plad
    format: yolo
    images_dir: images
    labels_dir: labels
    enabled: true
    max_images: null
  
  # Example: CPLID (VOC format)
  - name: cplid
    path: data/raw/cplid
    format: voc
    images_dir: JPEGImages
    ann_dir: Annotations
    enabled: true
    max_images: null
  
  # Example: TTPLA (if available)
  # - name: ttpla
  #   path: data/raw/ttpla
  #   format: yolo
  #   images_dir: images
  #   labels_dir: labels
  #   enabled: false
  #   max_images: null

# Default split ratios (used if dataset doesn't provide splits)
default_splits:
  train: 0.7
  val: 0.2
  test: 0.1
