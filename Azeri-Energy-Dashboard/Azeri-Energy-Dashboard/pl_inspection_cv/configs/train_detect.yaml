# YOLO Detection Training Configuration
# Path to dataset YAML (auto-generated by 01_make_detect_splits.py)
path: ./yolo_dataset
train: train/images
val: val/images
test: test/images  # optional

# Number of classes
nc: 6

# Class names
names:
  - glass_insulator
  - polymer_insulator
  - yoke_suspension
  - clamp
  - vari_grip
  - lightning_rod_suspension

# Model settings
model: yolo11n.pt  # or yolo11s.pt, yolo11m.pt, yolo11l.pt, yolo11x.pt
epochs: 100
imgsz: 640
batch: 16
workers: 8
device: 0  # GPU device, or 'cpu'

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0

# Optimization
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss
box: 7.5
cls: 0.5
dfl: 1.5

# Validation
val: true
save_period: 10

# Output
project: ./outputs/runs
name: detect_train
exist_ok: true
